plugins {
    id 'net.neoforged.moddev' version '2.0.107'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

group   = 'com.minecolonies.compat.tfc'
version = System.getenv('VERSION') ?: '1.0.0-indev'

base {
    archivesName = 'minecolonies-tfc-compat'
}

// Paths to local sibling projects — supply via -P flags or gradle.properties.
// When absent the build falls back to Maven artifacts for both mods.
def minecoloniesDir = findProperty('minecoloniesProjectDir')
def tfcDir          = findProperty('tfcProjectDir')

def mcLibsDir  = minecoloniesDir ? project.file("${minecoloniesDir}/build/libs") : null
def tfcLibsDir = tfcDir          ? project.file("${tfcDir}/build/libs")          : null

// ── Companion-version resolution ──────────────────────────────────────────────
// Read companion-mod versions from the sibling minecolonies/gradle.properties so
// this build stays in sync automatically when they update.
// When that file is absent (standalone / CI build) we fall back to the values
// declared in this project's own gradle.properties.
def mcPropsFile    = minecoloniesDir ? project.file("${minecoloniesDir}/gradle.properties") : null
def mcSiblingProps = new Properties()
if (mcPropsFile?.exists()) {
    mcPropsFile.withInputStream { mcSiblingProps.load(it) }
}
def resolveVersion = { String key ->
    (mcSiblingProps.getProperty(key) ?: project.findProperty(key)) as String
}

def patchouliVersion = project.findProperty('patchouliVersion') as String

// ── Local jar detection ────────────────────────────────────────────────────────
// Collect mod jars from each sibling project's build/libs directory.
// Returns an empty list when the directory does not exist or has not been built yet.
def collectJars = { File dir, List<String> excludeTokens ->
    dir.exists() ? (dir.listFiles()?.findAll { f ->
        f.name.endsWith('.jar') && excludeTokens.every { !f.name.contains(it) }
    } ?: []) : []
}

def mcJarList  = mcLibsDir  ? collectJars(mcLibsDir,  ['-sources', '-javadoc', '-slim', '-api']) : []
def tfcJarList = tfcLibsDir ? collectJars(tfcLibsDir, ['-sources', '-javadoc'])                  : []
def mcJars     = files(mcJarList)
def tfcJars    = files(tfcJarList)

if (mcJarList.isEmpty()) {
    logger.lifecycle('[compat] open-minecolonies local build not found — using GitHub release (open_minecolonies_version).')
}
if (tfcJarList.isEmpty()) {
    logger.lifecycle('[compat] TerraFirmaCraft local build not found — using Maven artifact (tfc_maven_version).')
}

// ── Runtime-companion configuration ───────────────────────────────────────────
// Holds jars that must be present in the game's mods/ folder at runtime but are
// not part of the compile classpath and not published as dependencies of this mod.
configurations {
    runtimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive    = false
    }
}

// Sync tasks copy all runtime mod jars into the game directory before each run.
// FML discovers mods by scanning the mods/ folder.
def syncClientMods = tasks.register('syncClientMods', Sync) {
    from mcJars, tfcJars, configurations.runtimeMods
    into project.file('run/client/mods')
}

def syncServerMods = tasks.register('syncServerMods', Sync) {
    from mcJars, tfcJars, configurations.runtimeMods
    into project.file('run/server/mods')
}

// ── open-minecolonies resolution ──────────────────────────────────────────────
// Uses the GitHub Releases API so draft releases are accessible.
// Set GITHUB_TOKEN (or GH_TOKEN) to access drafts; anonymous calls only see published releases.
// Release tag format : omc-v<version>
// Asset name format  : open-minecolonies-<version>.jar
def openMcVersion  = project.findProperty('open_minecolonies_version') as String
def openMcCacheJar = layout.buildDirectory.file("open-minecolonies-cache/open-minecolonies-${minecraftVersion}-${openMcVersion}.jar")

tasks.register('resolveOpenMinecolonies') {
    description = 'Downloads open-minecolonies from GitHub Releases (supports drafts via GITHUB_TOKEN).'
    outputs.file openMcCacheJar
    doLast {
        def outFile = openMcCacheJar.get().asFile
        def token   = System.getenv('GITHUB_TOKEN') ?: System.getenv('GH_TOKEN') ?: ''
        def tag     = "omc-v${openMcVersion}"
        def jarName = "open-minecolonies-${minecraftVersion}-${openMcVersion}.jar"

        Closure<InputStream> apiGet = { String url, String accept ->
            def conn = new URL(url).openConnection() as HttpURLConnection
            conn.setRequestProperty('Accept', accept)
            conn.setRequestProperty('X-GitHub-Api-Version', '2022-11-28')
            if (token) conn.setRequestProperty('Authorization', "Bearer ${token}")
            conn.instanceFollowRedirects = true
            conn.connect()
            if (conn.responseCode != 200)
                throw new GradleException("[compat] GitHub API returned ${conn.responseCode} for ${url}")
            conn.inputStream
        }

        def releases = new groovy.json.JsonSlurper()
            .parse(apiGet('https://api.github.com/repos/muellerjp/minecolonies/releases', 'application/vnd.github+json'))
        def release = releases.find { it.tag_name == tag }
        if (!release)
            throw new GradleException("[compat] No GitHub release found with tag '${tag}'.")

        def asset = release.assets.find { it.name == jarName }
        if (!asset)
            throw new GradleException("[compat] Asset '${jarName}' not found in release '${tag}'.")

        outFile.parentFile.mkdirs()
        outFile.bytes = apiGet(
            "https://api.github.com/repos/muellerjp/minecolonies/releases/assets/${asset.id}",
            'application/octet-stream'
        ).bytes
        logger.lifecycle("[compat] Downloaded ${jarName} from release '${tag}'.")
    }
}

def openMcFiles = files(openMcCacheJar).builtBy(tasks.named('resolveOpenMinecolonies'))

repositories {
    maven { url = 'https://ldtteam.jfrog.io/ldtteam/modding/' }  // structurize, blockui, domum-ornamentum, multipiston
    maven { url = 'https://maven.dries007.net/' }
    maven { url = 'https://maven.blamejared.com' }                // patchouli
    maven { url = 'https://api.modrinth.com/maven' }              // tfc fallback (maven.modrinth group)
    mavenLocal()
}

neoForge {
    // Declaring a version here also enables the additionalRuntimeClasspath configuration.
    version = neoForgeVersion

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            gameDirectory = project.file('run/client')
            taskBefore syncClientMods
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            taskBefore syncServerMods
        }
    }

    mods {
        create('minecolonies_tfc_compat') {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // ── MineColonies ───────────────────────────────────────────────────────────
    // Local build takes priority; Maven artifact used when it is absent.
    // The Maven artifact is also added to runtimeMods so runClient/runServer
    // still work in standalone mode.
    if (!mcJarList.isEmpty()) {
        compileOnly mcJars
    } else {
        compileOnly openMcFiles
        runtimeMods openMcFiles
    }

    // ── TerraFirmaCraft ────────────────────────────────────────────────────────
    // TFC does not publish to a traditional Maven repo.  When the local build is
    // absent we fall back to the Modrinth Maven using the Modrinth version-id
    // stored in tfc_maven_version (gradle.properties).
    if (!tfcJarList.isEmpty()) {
        compileOnly tfcJars
    } else {
        def v = project.findProperty('tfc_maven_version') as String
        compileOnly "maven.modrinth:terrafirmacraft:${v}"
        runtimeMods "maven.modrinth:terrafirmacraft:${v}"
    }

    // ── MineColonies companion mods ────────────────────────────────────────────
    // Versions are read from minecolonies/gradle.properties when available,
    // otherwise from this project's own gradle.properties (see fallbacks below).
    runtimeMods "com.ldtteam:structurize:${resolveVersion('structurize_version')}"
    runtimeMods "com.ldtteam:blockui:${resolveVersion('blockUI_version')}"
    runtimeMods "com.ldtteam:domum-ornamentum:${resolveVersion('domumOrnamentumVersion')}"
    runtimeMods "com.ldtteam:multipiston:${resolveVersion('multiPistonVersion')}"

    // ── TFC companion mods ─────────────────────────────────────────────────────
    runtimeMods "vazkii.patchouli:Patchouli:${patchouliVersion}"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        mod_version       : project.version,
        neo_version_range : "[${neoForgeVersion},)",
        minecraft_version : minecraftVersion,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
