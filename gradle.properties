org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true

javaVersion=21
neoForgeVersion=21.1.197
minecraftVersion=1.21.1

# Local sibling project paths used for runClient / runServer.
# Set these (or pass via -P flags) to compile against a local build instead of Maven.
# minecoloniesProjectDir=C:/path/to/minecolonies
# tfcProjectDir=C:/path/to/TerraFirmaCraft

# ── Maven fallback versions ────────────────────────────────────────────────────
# Used for compilation and runClient/runServer when sibling project builds are
# not found locally.  Update these to match the published release you want to
# target.
#
# open-minecolonies: served via GitHub Releases (https://github.com/muellerjp/minecolonies/releases)
# Release tag must be "v<version>" and the asset must be named "open-minecolonies-<version>.jar".
open_minecolonies_version=0.0.7
# TerraFirmaCraft: served via Modrinth Maven (https://api.modrinth.com/maven)
# Value must be the Modrinth version-id (8-char string), NOT the human-readable version number.
# Find it at https://modrinth.com/mod/terrafirmacraft/versions  (current: 4.1.0 = lv9gSYg1)
tfc_maven_version=lv9gSYg1

# ── MineColonies companion mod versions ───────────────────────────────────────
# When a local minecolonies/gradle.properties is readable these are sourced from
# it automatically.  The values below are used as fallbacks in standalone builds.
# Keep them in sync with minecolonies/gradle.properties.
structurize_version=1.0.810-1.21.1-snapshot
blockUI_version=1.0.199-1.21.1-snapshot
domumOrnamentumVersion=1.0.223-snapshot
multiPistonVersion=1.2.51-1.21.1-snapshot

# ── TFC companion mod versions ─────────────────────────────────────────────────
# Keep in sync with val patchouliVersion in TerraFirmaCraft/build.gradle.kts.
patchouliVersion=1.21.1-92-NEOFORGE
