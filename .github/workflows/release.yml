name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # TODO: fill in your CurseForge and Modrinth project IDs
          # curseforge-id: 000000
          # curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          # modrinth-id: xxxxxxxx
          # modrinth-token: ${{ secrets.MODRINTH_API_KEY }}

          github-tag: ${{ github.ref }}
          github-draft: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: MineColonies TFC Compat ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          java: 21
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          changelog-file: CHANGELOG.md
