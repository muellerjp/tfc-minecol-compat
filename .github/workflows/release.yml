name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  statuses: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --current --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Build
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          ##TODO: fill in your CurseForge and Modrinth project IDs
          curseforge-id: 1531514
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          # modrinth-id: xxxxxxxx
          # modrinth-token: ${{ secrets.MODRINTH_API_KEY }}

          github-tag: ${{ github.ref }}
          github-draft: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: MineColonies TFC Compat ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          java: 21
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          changelog-file: RELEASE_NOTES.md
